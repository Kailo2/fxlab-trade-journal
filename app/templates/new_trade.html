{% extends "base.html" %}
{% block title %}معامله جدید — FX Journal{% endblock %}
{% block content %}

<form method="post" class="trade-form">
  <div class="field">
    <label>نماد</label>
    <input type="text" name="symbol" placeholder="EURUSD" required>
  </div>
  <div class="row">
    <div class="field">
      <label>جهت</label>
      <select name="direction" required>
        <option value="long">خرید (Long)</option>
        <option value="short">فروش (Short)</option>
      </select>
    </div>
    <div class="field">
      <label>حجم (لات)</label>
      <input type="number" step="0.01" name="lots" value="1" required>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>قیمت ورود</label>
      <input type="number" step="0.00001" name="entry_price" required>
    </div>
    <div class="field">
      <label>قیمت خروج (اختیاری)</label>
      <input type="number" step="0.00001" name="exit_price">
    </div>
  </div>
  <div class="field">
    <label>سود/زیان (اختیاری -- اگه معامله هنوز بازه خالی بذار)</label>
    <input type="number" step="0.01" name="pnl">
  </div>
  <div class="row">
    <div class="field">
      <label>تاریخ باز شدن</label>
      <input type="date" name="opened_at" required>
    </div>
    <div class="field">
      <label>تاریخ بسته شدن (اختیاری)</label>
      <input type="date" name="closed_at">
    </div>
  </div>
  <div class="field">
    <label>یادداشت</label>
    <textarea name="notes" rows="3"></textarea>
  </div>
  <button type="submit">ثبت معامله</button>
</form>

{% endblock %}
